name: Build and Release DOCXImport plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (defaults to the version in plugin.xml)"
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  PLUGIN_NAME: DOCXImport
  PYTHON_VERSION: "3.11"
  QT_VERSION: "5.15.2"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.plugin-version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read plugin version
        id: plugin-version
        shell: bash
        run: |
          version="$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('plugin.xml').getroot().findtext('version', '').strip())")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 PyQt5==5.15.11
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: "false"
          cache: "true"
          cache-key-prefix: docximport-qt-${{ hashFiles('.github/workflows/reset-caches.txt') }}

      - name: Lint
        run: python -m flake8 .

      - name: Run tests
        run: |
          python -m unittest discover -v
          python -m compileall -q mmth tests

      - name: Validate translation extraction
        run: pylupdate5 -verbose -translate-function _t ./*.py -ts /tmp/docximport-template.ts

      - name: Build plugin
        run: |
          python buildplugin --language
          test -s "${PLUGIN_NAME}_v${{ steps.plugin-version.outputs.version }}.zip"

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: docximport-package
          path: ./DOCXImport_v*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release-metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PLUGIN_VERSION: ${{ needs.build.outputs.plugin_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG:-v${PLUGIN_VERSION}}"
          else
            release_tag="$REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download plugin package
        uses: actions/download-artifact@v8
        with:
          name: docximport-package
          path: dist

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release-metadata.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ env.PLUGIN_NAME }} ${{ steps.release-metadata.outputs.tag }}
          artifacts: "dist/${{ env.PLUGIN_NAME }}_v${{ needs.build.outputs.plugin_version }}.zip"
          generateReleaseNotes: true
          draft: false
          prerelease: false
