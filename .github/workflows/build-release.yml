name: Build and Release DOCXImport plugin

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  PLUGIN_NAME: DOCXImport
  PYTHON_VERSION: "3.11"
  QT_VERSION: "5.15.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 PyQt5==5.15.11
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: "false"
          cache: "true"
          cache-key-prefix: docximport-qt-${{ hashFiles('.github/workflows/reset-caches.txt') }}

      - name: Lint
        run: python -m flake8 .

      - name: Run tests
        run: |
          python -m unittest discover -v
          python -m compileall -q mmth tests

      - name: Validate translation extraction
        run: pylupdate5 -verbose -translate-function _t ./*.py -ts /tmp/docximport-template.ts

      - name: Build plugin
        run: python buildplugin --language

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: docximport-package
          path: ./DOCXImport_v*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v8
        with:
          name: docximport-package
          path: dist

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.PLUGIN_NAME }} ${{ github.ref_name }}
          artifacts: "dist/*.zip"
          generateReleaseNotes: true
          draft: true
          prerelease: false
